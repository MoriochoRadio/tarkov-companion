# 위키 퀘스트 가이드 한국어 백필 — 수동 실행(dispatch) 전용.
#
# 2026-08: GitHub Models 폐지(7/30)로 AI 요약 수단이 없어져 이 백필은 돌 수 없다.
# 매일 빈손으로 도는 cron만 쌓이므로 스케줄을 뗐다(Phase 45). 이미 만들어 둔
# 가이드 471개는 그대로 서비스되고, 패치로 생긴 신규 퀘스트만 가이드가 없다.
# 무료 AI 제공자를 다시 붙이면 cron 한 줄(17 2 * * *)만 되살리면 복구된다.
name: Quest Guides Backfill

on:
  workflow_dispatch:

permissions:
  contents: write
  models: read
  actions: write

concurrency:
  group: quest-guides
  cancel-in-progress: false

jobs:
  guides:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 가이드 생성 (하루 30개, 호출 상한 30)
        run: node scripts/generate-quest-guides.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MODELS_MAX_CALLS: 30

      - name: 커밋 & 푸시
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -d public/data/guides ]; then
            git add public/data/guides
          fi
          if git diff --cached --quiet; then
            echo "변경 없음 — 커밋 생략"
            echo "pushed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "퀘스트 가이드: $(TZ=Asia/Seoul date +%F) 백필"
            # 다른 콘텐츠 워크플로우와 push가 겹치면 non-fast-forward — 재시도로 방어
            for i in 1 2 3; do
              git pull --rebase origin main && git push origin main && break
              [ "$i" = 3 ] && exit 1
              echo "push 실패(${i}회차) — 5초 후 재시도"; sleep 5
            done
            echo "pushed=true" >> "$GITHUB_OUTPUT"
          fi

      # GITHUB_TOKEN push는 push 트리거를 발화시키지 않으므로 배포를 명시적으로 dispatch
      - name: Pages 재배포 트리거
        if: steps.commit.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref main --repo "$GITHUB_REPOSITORY"
